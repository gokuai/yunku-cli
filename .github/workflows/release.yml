name: Release

# Push a tag to publish a release:
#   git tag -a v0.1.0 -m "Release v0.1.0"
#   git push origin v0.1.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write      # goreleaser: create the GitHub release and upload assets
  id-token: write      # attest-build-provenance: sign the attestation
  attestations: write  # attest-build-provenance: store the attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so goreleaser can build the changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: dist/checksums.txt
